services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signflow}
      POSTGRES_USER: ${POSTGRES_USER:-signflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.8
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8081", "--hostname-backchannel-dynamic=true", "--hostname-strict=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-password}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./infra/keycloak/signflow-realm.json:/opt/keycloak/data/import/signflow-realm.json:ro

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-signflow-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-signflow-local-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - minio-data:/data

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-signflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-signflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      SIGNFLOW_CORS_ALLOWED_ORIGINS: ${SIGNFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SIGNFLOW_OIDC_ISSUER_URI: ${SIGNFLOW_OIDC_ISSUER_URI:-http://localhost:8081/realms/signflow}
      SIGNFLOW_OIDC_JWK_SET_URI: ${SIGNFLOW_OIDC_JWK_SET_URI:-http://keycloak:8080/realms/signflow/protocol/openid-connect/certs}
      SIGNFLOW_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      SIGNFLOW_OBJECT_STORAGE_PUBLIC_ENDPOINT: ${SIGNFLOW_OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      SIGNFLOW_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-signflow-local}
      SIGNFLOW_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-signflow-local-secret}
      SIGNFLOW_OBJECT_STORAGE_BUCKET: ${SIGNFLOW_OBJECT_STORAGE_BUCKET:-signflow-clinical-documents}
      SIGNFLOW_OBJECT_STORAGE_REGION: ${SIGNFLOW_OBJECT_STORAGE_REGION:-us-east-1}
      SIGNFLOW_DOCUMENT_MAX_SIZE_BYTES: ${SIGNFLOW_DOCUMENT_MAX_SIZE_BYTES:-10485760}
      SIGNFLOW_DOCUMENT_MAX_FILE_SIZE: ${SIGNFLOW_DOCUMENT_MAX_FILE_SIZE:-10MB}
      SIGNFLOW_DOCUMENT_URL_TTL_SECONDS: ${SIGNFLOW_DOCUMENT_URL_TTL_SECONDS:-300}
      SIGNFLOW_MLLP_ENABLED: ${SIGNFLOW_MLLP_ENABLED:-true}
      SIGNFLOW_MLLP_BIND_ADDRESS: 0.0.0.0
      SIGNFLOW_MLLP_PORT: 2575
      SIGNFLOW_HL7_RAW_RETENTION_DAYS: ${SIGNFLOW_HL7_RAW_RETENTION_DAYS:-30}
      SIGNFLOW_INGESTION_DEMO_ENABLED: ${SIGNFLOW_INGESTION_DEMO_ENABLED:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
      - "127.0.0.1:${MLLP_PORT:-2575}:2575"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-demo-nextauth-secret-change-for-non-local-use}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-signflow-frontend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-local-demo-frontend-secret}
      KEYCLOAK_EXTERNAL_ISSUER: ${KEYCLOAK_EXTERNAL_ISSUER:-http://localhost:8081/realms/signflow}
      KEYCLOAK_INTERNAL_ISSUER: ${KEYCLOAK_INTERNAL_ISSUER:-http://keycloak:8080/realms/signflow}
      NEXT_PUBLIC_KEYCLOAK_EXTERNAL_ISSUER: ${KEYCLOAK_EXTERNAL_ISSUER:-http://localhost:8081/realms/signflow}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
