spring:
  application:
    name: SignFlow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/signflow}
    username: ${SPRING_DATASOURCE_USERNAME:signflow}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${SIGNFLOW_DOCUMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${SIGNFLOW_DOCUMENT_MAX_FILE_SIZE:10MB}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SIGNFLOW_OIDC_ISSUER_URI:http://localhost:8081/realms/signflow}
          jwk-set-uri: ${SIGNFLOW_OIDC_JWK_SET_URI:http://localhost:8081/realms/signflow/protocol/openid-connect/certs}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${SERVER_PORT:8080}
signflow:
  api:
    cors-allowed-origins: ${SIGNFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  system:
    version: ${SIGNFLOW_VERSION:0.1.0}
  documents:
    endpoint: ${SIGNFLOW_OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${SIGNFLOW_OBJECT_STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${SIGNFLOW_OBJECT_STORAGE_ACCESS_KEY:signflow-local}
    secret-key: ${SIGNFLOW_OBJECT_STORAGE_SECRET_KEY:signflow-local-secret}
    bucket: ${SIGNFLOW_OBJECT_STORAGE_BUCKET:signflow-clinical-documents}
    region: ${SIGNFLOW_OBJECT_STORAGE_REGION:us-east-1}
    max-size-bytes: ${SIGNFLOW_DOCUMENT_MAX_SIZE_BYTES:10485760}
    temporary-url-seconds: ${SIGNFLOW_DOCUMENT_URL_TTL_SECONDS:300}
    demo-enabled: ${SIGNFLOW_DOCUMENT_DEMO_ENABLED:false}
  ingestion:
    max-message-bytes: ${SIGNFLOW_HL7_MAX_MESSAGE_BYTES:5242880}
    raw-retention-days: ${SIGNFLOW_HL7_RAW_RETENTION_DAYS:30}
    mllp-enabled: ${SIGNFLOW_MLLP_ENABLED:false}
    mllp-bind-address: ${SIGNFLOW_MLLP_BIND_ADDRESS:127.0.0.1}
    mllp-port: ${SIGNFLOW_MLLP_PORT:2575}
    demo-enabled: ${SIGNFLOW_INGESTION_DEMO_ENABLED:false}
  signature-requests:
    pdfa3-render-dpi: ${SIGNFLOW_SIGNATURE_PDFA3_RENDER_DPI:144}
    max-pages: ${SIGNFLOW_SIGNATURE_MAX_PAGES:100}
    max-rendered-pixels: ${SIGNFLOW_SIGNATURE_MAX_RENDERED_PIXELS:100000000}
  signature-providers:
    aruba:
      service-url: ${SIGNFLOW_ARUBA_SERVICE_URL:https://arss.demo.firma-automatica.it/ArubaSignService/ArubaSignService}
      username: ${SIGNFLOW_ARUBA_USERNAME:}
      password: ${SIGNFLOW_ARUBA_PASSWORD:}
      otp-authentication-type: ${SIGNFLOW_ARUBA_OTP_AUTHENTICATION_TYPE:demoprod}
      certificate-id: ${SIGNFLOW_ARUBA_CERTIFICATE_ID:AS0}
  external-delivery:
    allow-mock-signatures: ${SIGNFLOW_EXTERNAL_ALLOW_MOCK_SIGNATURES:false}
    max-retries: ${SIGNFLOW_EXTERNAL_MAX_RETRIES:2}
    demo-enabled: ${SIGNFLOW_EXTERNAL_DEMO_ENABLED:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
